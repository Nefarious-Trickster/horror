<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>The Tall One</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <style>
    /* one dark visual world (a facility at night), so the page commits to a single dark look */
    :root {
      --bg: #020304; --ui-fg: #dfe6e6; --ui-dim: #7d8a8c; --ui-accent: #3fb8b0; --ui-red: #b3261e;
      --line: #22302f; --line-hi: #3e5655; --panel: rgba(6, 10, 11, 0.74); --panel-on: rgba(20, 60, 58, 0.8);
      --ui-font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --ui-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ui-fg); overflow: hidden; font-family: var(--ui-font); -webkit-user-select: none; user-select: none; }
    canvas.game { display: block; touch-action: none; position: fixed; inset: 0; }

    #menu { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at 50% 40%, #0b1213 0%, #020304 70%); transition: opacity 1s; }
    #menu.gone { opacity: 0; pointer-events: none; }
    #menu .card { width: min(520px, 100%); text-align: center; }
    #menu .org { font: 500 11px/1 var(--ui-mono); letter-spacing: 0.42em; color: var(--ui-accent); margin-bottom: 26px; }
    #menu h1 { font: 300 clamp(30px, 7vw, 54px)/1.05 var(--ui-font); letter-spacing: 0.34em; margin: 0 0 10px; text-indent: 0.34em; }
    #menu .sub { font: 400 12px/1.7 var(--ui-mono); letter-spacing: 0.18em; color: var(--ui-dim); margin-bottom: 34px; }
    #menu .load { width: 200px; height: 2px; background: #142021; margin: 0 auto 28px; transition: opacity 0.6s; }
    #menu .load.done { opacity: 0; }
    #bar { height: 100%; width: 0; background: var(--ui-accent); transition: width 0.2s; }
    #menu .opts { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    #menu button { font: 500 12px/1 var(--ui-mono); letter-spacing: 0.3em; color: var(--ui-dim); background: none; border: 1px solid var(--line); padding: 14px 0; width: 260px; max-width: 100%; cursor: default; opacity: 0.45; transition: all 0.3s; }
    #menu button.always { opacity: 1; color: var(--ui-fg); cursor: pointer; border-color: var(--line-hi); }
    #menu button.always:hover, #menu button.always:focus-visible { border-color: var(--ui-accent); color: #fff; outline: none; }
    #menu.ready button { opacity: 1; color: var(--ui-fg); cursor: pointer; border-color: var(--line-hi); }
    #menu.ready button:hover, #menu.ready button:focus-visible { border-color: var(--ui-accent); color: #fff; outline: none; }
    #menu .keys { margin-top: 30px; font: 400 11px/2 var(--ui-mono); color: var(--ui-dim); letter-spacing: 0.06em; }
    #menu .keys b { color: var(--ui-fg); font-weight: 500; }
    #status { color: #d0605a; font: 400 12px/1.4 var(--ui-mono); margin-top: 16px; min-height: 1em; }

    /* creature study panel */
    #actions { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 4px; z-index: 12; max-height: calc(100% - 28px); overflow-y: auto; }
    #actions .title { font: 600 10px/1 var(--ui-mono); letter-spacing: 0.25em; color: var(--ui-dim); margin: 0 0 4px 2px; }
    #actions button { font: 500 12px/1 var(--ui-mono); letter-spacing: 0.06em; color: var(--ui-fg); background: var(--panel); border: 1px solid var(--line); padding: 7px 12px 7px 8px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 9px; min-width: 150px; }
    #actions button:hover { border-color: var(--line-hi); }
    #actions button:focus-visible { outline: 1px solid var(--ui-accent); outline-offset: 1px; }
    #actions button.on { border-color: var(--ui-accent); background: var(--panel-on); }
    #actions kbd { font: inherit; font-size: 10px; color: var(--ui-dim); border: 1px solid var(--line); min-width: 18px; text-align: center; padding: 1px 3px; }
    body.touch #actions { top: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: auto; left: 50%; transform: translateX(-50%); flex-direction: row; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px); }
    body.touch #actions button { min-width: 0; padding: 8px 9px; }
    body.touch #actions kbd, body.touch #actions .title { display: none; }
    @media (prefers-reduced-motion: reduce) { #menu, #menu button { transition: none; } }
  </style>
</head>
<body>
  <div id="menu">
    <div class="card">
      <div class="org">HALVERSEN BIOCONTAINMENT · SITE 41</div>
      <h1>THE TALL ONE</h1>
      <div class="sub">a containment incident in five parts</div>
      <div class="load"><div id="bar"></div></div>
      <div class="opts">
        <button type="button" data-level="intro">BEGIN · PROLOGUE</button>
        <button type="button" data-level="chapter1">CHAPTER ONE · THE BUILD-OUT</button>
        <button type="button" data-level="chapter2">CHAPTER TWO · PUMP LEVEL</button>
        <button type="button" data-level="chapter3">CHAPTER THREE · THE ARCHIVE</button>
        <button type="button" data-level="test">CREATURE STUDY</button>
        <button type="button" id="settingsBtn" class="always">SETTINGS</button>
      </div>
      <div class="keys">
        <b>WASD</b> move · <b>mouse</b> look · <b>shift</b> run · <b>C</b> crouch · <b>E</b> use<br />
        <b>F</b> flashlight · <b>right mouse / Q</b> halide lamp · headphones recommended
      </div>
      <div id="status"></div>
    </div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
